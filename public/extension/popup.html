<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cyberpunk Termux Bridge</title>
  <style>
    :root { color-scheme: dark; }
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background: #0a0a0f;
      color: #39ff14;
      font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
      font-size: 13px;
    }
    h1 { margin: 0 0 8px; font-size: 14px; color: #8b5cf6; letter-spacing: 0.05em; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    label { display: block; margin-top: 12px; font-size: 11px; color: #7dd3fc; text-transform: uppercase; }
    input, textarea {
      width: 100%; box-sizing: border-box;
      background: #11111a; color: #e5e7eb; border: 1px solid #1f2937;
      border-radius: 4px; padding: 6px 8px; font-family: inherit; font-size: 12px;
      margin-top: 4px;
    }
    textarea { min-height: 70px; resize: vertical; }
    button {
      width: 100%; margin-top: 10px; padding: 8px;
      background: linear-gradient(90deg, #39ff14, #8b5cf6); color: #0a0a0f;
      border: 0; border-radius: 4px; font-weight: 700; cursor: pointer;
      font-family: inherit; text-transform: uppercase; letter-spacing: 0.06em;
    }
    button.secondary {
      background: transparent; color: #8b5cf6; border: 1px solid #8b5cf6;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 11px; color: #a3a3a3; min-height: 14px; }
    .ok { color: #39ff14; }
    .err { color: #ef4444; }
    .linked { display: flex; align-items: center; gap: 6px; color: #39ff14; font-size: 11px; }
    .hidden { display: none; }
    .code { font-size: 18px; letter-spacing: 0.2em; color: #39ff14; text-align: center; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>// CYBERPUNK TERMUX BRIDGE</h1>

  <div id="unlinked">
    <p style="color:#a3a3a3;font-size:11px;margin:8px 0">
      Link this extension to your Cyberpunk Termux IDE with a one-tap approval —
      no tokens to copy.
    </p>
    <button id="link-btn">⚡ Link with IDE</button>
    <div id="link-code-block" class="hidden">
      <div class="code" id="link-code">—</div>
      <p style="color:#a3a3a3;font-size:11px;text-align:center;margin:4px 0">
        Approve in the browser tab we just opened…
      </p>
    </div>
  </div>

  <div id="linked-area" class="hidden">
    <div class="linked"><span>✓ Linked as</span> <strong id="linked-user">…</strong>
      <button id="unlink" class="secondary" style="width:auto;padding:2px 8px;margin:0 0 0 auto;font-size:10px">UNLINK</button>
    </div>

    <label for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="Optional instruction to attach…"></textarea>

    <label for="selection">Captured Selection</label>
    <textarea id="selection" placeholder="Highlight text on a page before opening this popup"></textarea>

    <button id="send">⚡ Send to Cyberpunk Termux</button>
  </div>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
